[package]
edition = "2024"
license = "MPL-2.0"
name = "evolving-trader-example"
publish = false
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
symbiont = { path = "../../symbiont", features = ["dsh-export"] }

tokio.workspace = true
tracing.workspace = true

lfest = "0.138.3"
plotters = { version = "0.3", default-features = false, features = [
  "bitmap_backend",
  "bitmap_encoder",
  "line_series",
  "ttf",
] }
trade_aggregation = "13"
viuer = { version = "0.11", features = ["print-file"] }
