[package]
authors = ["MathisWellmann <wellmannmathis@gmail.com>"]
categories = ["algorithms", "artificial-intelligence"]
description = "Optional memory across symbiont evolve calls: an archive of evaluated programs, recurring failures and an ACE playbook of lessons, rendered into the next prompt."
edition = "2024"
keywords = ["agent", "evolution", "llm", "memory"]
license = "MPL-2.0"
name = "symbiont-memory"
repository = "https://github.com/MathisWellmann/symbiont"
version.workspace = true

[lints]
workspace = true

[dependencies]
# local workspace crates
symbiont = { version = "0.45.0", path = "../symbiont" }

# workspace dependencies
getset.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
typed-builder.workspace = true

[dev-dependencies]
tracing-test.workspace = true
